name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The lockfile is written on Windows; `npm install` resolves the Linux
      # optional binaries (rolldown, esbuild) that `npm ci` would reject.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + security tests (PGlite, no API key needed)
        run: npm test
      - name: Build web app
        run: npm run build
